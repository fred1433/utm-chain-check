name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit checks, the security recipe and the control chains
        run: npm test

      - name: A browser for the journey check
        run: npx playwright install --with-deps chromium

      - name: The measurement journey, from the click to the query
        run: npm run test:journey

      - name: The allowlist is read in one place, and nothing in the source sets it
        run: |
          test "$(grep -rl UTM_CHAIN_CHECK_ALLOWLIST src/ || true)" = "src/lib/net/policy.ts"
          ! grep -rn "UTM_CHAIN_CHECK_ALLOWLIST=" src/ next.config.ts
